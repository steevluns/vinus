name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Find and extract ZIP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(
            find . -type f -name '*.zip' \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -not -path './extracted/*' \
              -print0
          )

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "ERROR: No .zip file found in the repository."
            exit 1
          fi

          mkdir -p extracted
          for archive in "${archives[@]}"; do
            name="$(basename "$archive" .zip)"
            destination="extracted/$name"
            mkdir -p "$destination"
            echo "Extracting $archive into $destination"
            python3 - "$archive" "$destination" <<'PYTHON'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (destination / item.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe ZIP entry path: {item.filename}")
              zf.extractall(destination)
          PYTHON
          done

      - name: Commit extracted files to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
            exit 0
          fi
          git commit -m "Extract project ZIP files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
