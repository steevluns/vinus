name: Build Vinus APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vinus-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Lightning Plus and Lite debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleLightningPlusDebug :app:assembleLightningLiteDebug --stacktrace

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: vinus-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
