name: Actions

on:
  push:
    branches:
      - main
      - feature/image-long-press-menu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DownLS10 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
        with:
          ref: feature/image-long-press-menu

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.2'
          arguments: --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DownLS10-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
