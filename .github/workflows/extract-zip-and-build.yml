name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-zip-and-build.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'src/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify extracted Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle || { echo "build.gradle not found at repository root"; exit 1; }
          test -f settings.gradle || { echo "settings.gradle not found at repository root"; exit 1; }
          test -f src/main/AndroidManifest.xml || { echo "AndroidManifest.xml not found"; exit 1; }
          echo "Android project files are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vinus-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
