name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/بناء.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'src/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Check Android project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle || { echo "ERROR: settings.gradle is missing."; exit 1; }
          test -f build.gradle || { echo "ERROR: build.gradle is missing."; exit 1; }
          test -f src/main/AndroidManifest.xml || { echo "ERROR: src/main/AndroidManifest.xml is missing."; exit 1; }

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 14
