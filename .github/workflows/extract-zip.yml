name: Extract uploaded ZIP into repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -not -path './.github/*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No .zip file found in this repository checkout. The ZIP must be committed to GitHub first."
            echo "Files in repository root:"
            ls -la
            exit 1
          fi
          echo "Found archive: $ZIP_FILE"
          mkdir -p .zip-extract-tmp
          unzip -o "$ZIP_FILE" -d .zip-extract-tmp

          # Detect and unwrap a single top-level directory, otherwise use archive contents as-is.
          shopt -s dotglob nullglob
          entries=(.zip-extract-tmp/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            SOURCE_DIR="${entries[0]}"
          else
            SOURCE_DIR=".zip-extract-tmp"
          fi

          # Copy all extracted files, including dotfiles, into the repository root.
          cp -a "$SOURCE_DIR"/. .
          rm -rf .zip-extract-tmp
          rm -f "$ZIP_FILE"
          echo "Extraction complete. Changed files:"
          git status --short

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract project ZIP into repository"
          git push origin HEAD:main
