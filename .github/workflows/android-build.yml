name: Build MyBLight APK (No Emulator)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build MyBLight debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleLightningPlusDebug --write-locks --no-daemon

      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/lightningPlus/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'acr.browser.lightning.downloadmanager.DownloadsActivity' /tmp/manifest.txt
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload MyBLight APK
        uses: actions/upload-artifact@v6
        with:
          name: MyBLight-debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
